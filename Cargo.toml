[package]
name = "woodworking"
version = "0.1.0"
edition = "2021"
description = "A small 3D layout tool for kitchens, cabinets, and other rooms."
publish = false

[dependencies]
bevy = "0.20"
bevy_egui = "0.43"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

# Debug builds of Bevy are too slow to use as a layout tool.
# Optimize dependencies so `cargo run` is actually workable.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
